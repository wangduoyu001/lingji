<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="extension.css" />
  <title>LingJi Capture 设置</title>
</head>
<body class="options">
  <main>
    <h1>LingJi Capture 设置</h1>
    <p>扩展只连接本机灵机 API。不要把控制令牌交给网页或第三方服务。</p>
    <label>API 地址<input id="baseUrl" value="http://127.0.0.1:8766" /></label>
    <label>控制令牌<input id="token" type="password" /></label>
    <div class="actions"><button id="save">保存</button><button id="test" class="secondary">测试连接</button></div>
    <div id="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
