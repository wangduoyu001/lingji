name: tests

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q main.py run_service.py run_mcp_server.py src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  mcp-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MCP dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Create MCP server
        env:
          VAULT_DIR: ${{ runner.temp }}/lingji-vault
          STORAGE_DIR: ${{ runner.temp }}/lingji-storage
          WATCHDOG_ENABLED: "false"
        run: |
          python - <<'PY'
          from src.mcp_server import create_mcp_server
          server = create_mcp_server(default_agent_id="lingji-local")
          assert server is not None
          print("LingJi MCP server created successfully")
          PY
