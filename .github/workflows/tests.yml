name: tests

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q main.py run_service.py run_mcp_server.py run_extraction_worker.py src tests scripts
      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > test-output-${{ matrix.python-version }}.log 2>&1
          status=$?
          tail -n 220 test-output-${{ matrix.python-version }}.log
          exit $status
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.python-version }}
          path: test-output-${{ matrix.python-version }}.log
          retention-days: 3

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile on Windows
        run: python -m compileall -q main.py run_service.py run_mcp_server.py run_extraction_worker.py src tests scripts
      - name: Run unit tests on Windows
        run: python -m unittest discover -s tests -v

  obsidian-plugin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin JavaScript and manifest
        run: |
          node --check obsidian-plugin/lingji-control/main.js
          node -e "const m=require('./obsidian-plugin/lingji-control/manifest.json'); if(!m.id||!m.version) process.exit(1)"

  mcp-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MCP dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Create MCP server
        env:
          VAULT_DIR: ${{ runner.temp }}/lingji-vault
          STORAGE_DIR: ${{ runner.temp }}/lingji-storage
          WATCHDOG_ENABLED: "false"
        run: |
          python - <<'PY'
          from src.mcp_server import create_mcp_server
          server = create_mcp_server(default_agent_id="lingji-local")
          assert server is not None
          print("LingJi MCP server created successfully")
          PY
