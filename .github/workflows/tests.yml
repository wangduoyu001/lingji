name: tests

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Compile Python files
        run: python -m compileall -q main.py run_service.py run_control_api.py run_mcp_server.py run_extraction_worker.py src tests scripts
      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > test-output-${{ matrix.python-version }}.log 2>&1
          status=$?
          tail -n 260 test-output-${{ matrix.python-version }}.log
          exit $status
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.python-version }}
          path: test-output-${{ matrix.python-version }}.log
          retention-days: 3

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Compile on Windows
        run: python -m compileall -q main.py run_service.py run_control_api.py run_mcp_server.py run_extraction_worker.py src tests scripts
      - name: Run unit tests on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> test-output-windows-3.12.log
          $status = $LASTEXITCODE
          Get-Content test-output-windows-3.12.log -Tail 280
          exit $status
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-windows-3.12
          path: test-output-windows-3.12.log
          retention-days: 3

  desktop-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/lingji-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/lingji-control/package.json
      - name: Install desktop UI dependencies
        run: npm install --no-audit --no-fund
      - name: Build React control center
        shell: bash
        run: |
          set +e
          npm run build > desktop-ui-build.log 2>&1
          status=$?
          cat desktop-ui-build.log
          exit $status
      - name: Validate Tauri configuration
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); if(!c.identifier||!c.build||!c.app) process.exit(1)"
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('src-tauri/capabilities/default.json','utf8')); if(!c.identifier||!Array.isArray(c.permissions)) process.exit(1)"
      - name: Upload desktop UI build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-build-log
          path: desktop/lingji-control/desktop-ui-build.log
          retention-days: 3

  browser-capture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser extension
        run: |
          node --check browser-extension/lingji-capture/background.js
          node --check browser-extension/lingji-capture/popup.js
          node --check browser-extension/lingji-capture/options.js
          node -e "const m=require('./browser-extension/lingji-capture/manifest.json'); if(m.manifest_version!==3||!m.background||!m.options_page) process.exit(1)"

  obsidian-plugin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin JavaScript and manifest
        run: |
          node --check obsidian-plugin/lingji-control/main.js
          node -e "const m=require('./obsidian-plugin/lingji-control/manifest.json'); if(!m.id||!m.version) process.exit(1)"

  mcp-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MCP dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Create MCP server
        env:
          VAULT_DIR: ${{ runner.temp }}/lingji-vault
          STORAGE_DIR: ${{ runner.temp }}/lingji-storage
          WATCHDOG_ENABLED: "false"
        run: |
          python - <<'PY'
          from src.mcp_server import create_mcp_server
          server = create_mcp_server(default_agent_id="lingji-local")
          assert server is not None
          print("LingJi MCP server created successfully")
          PY
