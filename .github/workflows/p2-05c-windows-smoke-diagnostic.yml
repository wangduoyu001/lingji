name: P2-05C Windows Smoke Diagnostic

on:
  push:
    branches:
      - work/p2-05c-capture-center-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/lingji-control
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/lingji-control/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Acceptance smoke
        id: acceptance
        continue-on-error: true
        shell: pwsh
        run: npm exec tsx scripts/acceptance-smoke.mjs 2>&1 | Tee-Object acceptance.log

      - name: Modular smoke
        id: modular
        continue-on-error: true
        shell: pwsh
        run: npm exec tsx scripts/ui-modular-smoke.mjs 2>&1 | Tee-Object modular.log

      - name: Vector smoke
        id: vector
        continue-on-error: true
        shell: pwsh
        run: npm exec tsx scripts/vector-center-smoke.mjs 2>&1 | Tee-Object vector.log

      - name: Hardware smoke
        id: hardware
        continue-on-error: true
        shell: pwsh
        run: npm exec tsx scripts/hardware-smoke.mjs 2>&1 | Tee-Object hardware.log

      - name: Models smoke
        id: models
        continue-on-error: true
        shell: pwsh
        run: npm exec tsx scripts/models-smoke.mjs 2>&1 | Tee-Object models.log

      - name: Memory Inspector smoke
        id: inspector
        continue-on-error: true
        shell: pwsh
        run: npm exec tsx scripts/memory-inspector-smoke.mjs 2>&1 | Tee-Object inspector.log

      - name: Capture Center smoke
        id: capture
        continue-on-error: true
        shell: pwsh
        run: npm exec tsx scripts/capture-center-smoke.mjs 2>&1 | Tee-Object capture.log

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-05c-windows-smoke-logs
          path: desktop/lingji-control/*.log
          retention-days: 3

      - name: Report outcomes
        if: always()
        shell: pwsh
        env:
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
          MODULAR: ${{ steps.modular.outcome }}
          VECTOR: ${{ steps.vector.outcome }}
          HARDWARE: ${{ steps.hardware.outcome }}
          MODELS: ${{ steps.models.outcome }}
          INSPECTOR: ${{ steps.inspector.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          Write-Host "acceptance=$env:ACCEPTANCE modular=$env:MODULAR vector=$env:VECTOR hardware=$env:HARDWARE models=$env:MODELS inspector=$env:INSPECTOR capture=$env:CAPTURE build=$env:BUILD"
          if (@($env:ACCEPTANCE,$env:MODULAR,$env:VECTOR,$env:HARDWARE,$env:MODELS,$env:INSPECTOR,$env:CAPTURE,$env:BUILD) -contains "failure") { exit 1 }
