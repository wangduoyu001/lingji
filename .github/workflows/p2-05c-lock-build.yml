name: P2-05C Lock and Build Gate

on:
  push:
    branches:
      - work/p2-05c-capture-center-ui
  pull_request:
    branches:
      - feature/second-brain-memory
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-locks-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop/lingji-control
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/lingji-control/package-lock.json

      - name: Align file dialog and mode controls
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path("src/pages/CaptureCenterPage.tsx")
          page = page_path.read_text(encoding="utf-8")
          old_picker = '''  const chooseFile = async () => {
              try {
                const { open } = await import("@tauri-apps/plugin-dialog");
                const selected = await open({ multiple: false, directory: false });
                if (typeof selected === "string") setSelectedPath(selected);
              } catch {
                setSubmissionMessage("文件选择仅在已配置 Dialog Plugin 的桌面应用中可用");
              }
            };'''
          new_picker = '''  const chooseFile = async () => {
              try {
                const { open } = await import("@tauri-apps/plugin-dialog");
                const mode = tab === "chatgpt_export" ? "chatgpt_export" : tab === "codex_report" ? "codex_report" : fileMode;
                const filters = tab === "media"
                  ? [{ name: "音频和视频", extensions: ["mp4", "mov", "mkv", "avi", "webm", "m4v", "flv", "ts", "mts", "m2ts", "mp3", "wav", "m4a", "aac", "flac", "ogg", "opus", "wma"] }]
                  : mode === "chatgpt_export"
                    ? [{ name: "ChatGPT Export", extensions: ["zip", "json"] }]
                    : mode === "codex_report"
                      ? [{ name: "Codex Report", extensions: ["json"] }]
                      : [{ name: "Web Snapshot", extensions: ["html", "htm", "json", "txt", "md"] }];
                const selected = await open({ multiple: false, directory: false, filters });
                if (typeof selected === "string") setSelectedPath(selected);
              } catch {
                setSubmissionMessage("文件选择仅在已配置 Dialog Plugin 的桌面应用中可用");
              }
            };'''
          if old_picker not in page:
              raise SystemExit("file picker contract block not found")
          page = page.replace(old_picker, new_picker)
          page = page.replace('''        <button disabled={status?.mode === "normal"} onClick={() => void setMode("resume")}>正常</button>
                  <button disabled={status?.mode === "low_power"} onClick={() => void setMode("resume")}>低功耗</button>
          ''', "")
          page_path.write_text(page, encoding="utf-8")

          smoke_path = Path("scripts/capture-center-smoke.mjs")
          smoke = smoke_path.read_text(encoding="utf-8")
          marker = 'assert.ok(page.includes("multiple: false"));\n'
          additions = marker + 'assert.ok(page.includes("filters"));\nassert.ok(!page.includes(">正常</button>"));\nassert.ok(!page.includes(">低功耗</button>"));\n'
          if marker not in smoke:
              raise SystemExit("capture smoke marker not found")
          smoke_path.write_text(smoke.replace(marker, additions), encoding="utf-8")
          PY

      - name: Generate npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Capture Center smoke
        id: capture_smoke
        continue-on-error: true
        run: npm run test:capture 2>&1 | tee capture-center-smoke.log

      - name: Run all desktop smoke tests
        id: desktop_smoke
        continue-on-error: true
        run: npm run test:smoke 2>&1 | tee desktop-smoke.log

      - name: Build desktop frontend
        id: desktop_build
        continue-on-error: true
        run: npm run build 2>&1 | tee desktop-build.log

      - name: Generate Cargo lock
        id: cargo_lock
        continue-on-error: true
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-lock.log

      - name: Check Tauri crate
        id: cargo_check
        continue-on-error: true
        run: cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-check.log

      - name: Commit generated locks and reviewed fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src/pages/CaptureCenterPage.tsx scripts/capture-center-smoke.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "build(desktop): lock dialog dependencies and align picker contracts"
            git push origin HEAD:work/p2-05c-capture-center-ui
          fi

      - name: Upload generated locks and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-05c-generated-locks
          path: |
            desktop/lingji-control/package-lock.json
            desktop/lingji-control/src-tauri/Cargo.lock
            desktop/lingji-control/capture-center-smoke.log
            desktop/lingji-control/desktop-smoke.log
            desktop/lingji-control/desktop-build.log
            desktop/lingji-control/cargo-lock.log
            desktop/lingji-control/cargo-check.log
          retention-days: 3

      - name: Enforce gate result
        if: always()
        shell: bash
        env:
          CAPTURE_SMOKE: ${{ steps.capture_smoke.outcome }}
          DESKTOP_SMOKE: ${{ steps.desktop_smoke.outcome }}
          DESKTOP_BUILD: ${{ steps.desktop_build.outcome }}
          CARGO_LOCK: ${{ steps.cargo_lock.outcome }}
          CARGO_CHECK: ${{ steps.cargo_check.outcome }}
        run: |
          printf 'capture=%s desktop-smoke=%s build=%s cargo-lock=%s cargo-check=%s\n' \
            "$CAPTURE_SMOKE" "$DESKTOP_SMOKE" "$DESKTOP_BUILD" "$CARGO_LOCK" "$CARGO_CHECK"
          test "$CAPTURE_SMOKE" = success
          test "$DESKTOP_SMOKE" = success
          test "$DESKTOP_BUILD" = success
          test "$CARGO_LOCK" = success
          test "$CARGO_CHECK" = success
