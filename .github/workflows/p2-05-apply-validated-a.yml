name: Apply Validated P2-05A Artifact

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/p2-05-apply-validated-a.yml

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout P2-05A branch
        uses: actions/checkout@v4
        with:
          ref: work/p2-05a-capture-control-api
          fetch-depth: 0

      - name: Download validated artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api `
            -H "Accept: application/vnd.github+json" `
            /repos/${{ github.repository }}/actions/artifacts/8487363168/zip `
            > validated-a.zip
          Expand-Archive validated-a.zip -DestinationPath validated-a -Force

      - name: Apply validated files and remove temporary tooling
        shell: pwsh
        run: |
          $files = @(
            "src/control/api.py",
            "src/control/capture.py",
            "tests/test_capture_api.py",
            "tests/test_capture_control.py",
            "tests/test_extraction_queue.py"
          )
          foreach ($file in $files) {
            $source = Join-Path "validated-a" $file
            if (-not (Test-Path $source)) { throw "Artifact file missing: $file" }
            New-Item -ItemType Directory -Force -Path (Split-Path $file) | Out-Null
            Copy-Item $source $file -Force
          }
          Remove-Item scripts/p2_05a_review_fix.py -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/p2-05a-review-fix.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/p2-05a-patch-diagnostics.yml -ErrorAction SilentlyContinue
          Remove-Item validated-a.zip -ErrorAction SilentlyContinue
          Remove-Item validated-a -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify artifact digest in working tree
        shell: pwsh
        run: |
          python -m compileall -q src/control src/extraction/queue.py tests/test_capture_control.py tests/test_capture_api.py tests/test_extraction_queue.py
          git diff --check

      - name: Commit validated files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(control): apply validated capture integration contracts"
          git push origin HEAD:work/p2-05a-capture-control-api
