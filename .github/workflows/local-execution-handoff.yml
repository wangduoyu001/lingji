name: local-execution-handoff

on:
  pull_request:
  push:
    branches:
      - master
      - 'feature/**'
      - 'work/**'
      - 'acceptance/**'

permissions:
  contents: read

jobs:
  validate-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate task and result mailbox
        shell: bash
        run: |
          python scripts/check_local_execution_handoff.py --ref-name "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

      - name: Run handoff unit tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_local_execution_handoff.py
