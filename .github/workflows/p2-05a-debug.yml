name: P2-05A Patch Diagnostics

on:
  push:
    branches:
      - work/p2-05a-capture-control-api
  pull_request:
    branches:
      - feature/second-brain-memory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and run patch script
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          $workflow = Get-Content -Raw ".github/workflows/p2-05a-review-fix.yml"
          $match = [regex]::Match($workflow, "(?s)@'\r?\n(.*?)\r?\n\s*'@ \| python -")
          if (-not $match.Success) {
            "embedded patch script not found" | Set-Content p2-05a-patch.log
            exit 2
          }
          $script = [regex]::Replace($match.Groups[1].Value, "(?m)^          ", "")
          Set-Content -Path p2-05a-patch.py -Value $script -Encoding utf8
          python p2-05a-patch.py 2>&1 | Tee-Object -FilePath p2-05a-patch.log
          exit $LASTEXITCODE

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-05a-patch-diagnostics
          path: |
            p2-05a-patch.py
            p2-05a-patch.log
          retention-days: 2

      - name: Enforce diagnostic result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.patch.outcome }}" -ne "success") { exit 1 }
