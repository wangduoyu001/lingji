name: Finalize P2-06 Formal Documentation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/p2-06-finalize-docs.yml

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout formal branch
        uses: actions/checkout@v4
        with:
          ref: feature/second-brain-memory
          fetch-depth: 0

      - name: Update formal documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          FORMAL_MERGE = "5ce10ed8be98784f57e8723ffc27e40e3abaffbc"
          VALIDATED_HEAD = "6dfa31148585e2cb78c83af52b752550962820c9"
          IMPLEMENTATION = "4b0ad577eb396030ee6baa5c3bb217e990385475"

          def patch(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f"marker missing in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          patch(
              "docs/PROJECT_STATUS.md",
              "> P2-05 Status（P2-05 状态）: `MERGED_AND_VALIDATED`",
              "> P2-05 Status（P2-05 状态）: `MERGED_AND_VALIDATED`  \n"
              f"> P2-06 Validated Head（P2-06 已验证提交）: `{VALIDATED_HEAD}`  \n"
              f"> P2-06 Formal Merge Commit（P2-06 正式合并提交）: `{FORMAL_MERGE}`  \n"
              "> P2-06 Status（P2-06 状态）: `MERGED_AND_VALIDATED`",
          )
          patch(
              "docs/PROJECT_STATUS.md",
              "P2-05 Manual Capture Center                       MERGED_AND_VALIDATED\n",
              "P2-05 Manual Capture Center                       MERGED_AND_VALIDATED\n"
              "P2-06 Obsidian CLI Formal Migration                MERGED_AND_VALIDATED\n",
          )
          p206_section = f'''## 7. P2-06 Obsidian CLI Formal Migration

状态：`MERGED_AND_VALIDATED`

```text
Validated implementation -> {IMPLEMENTATION}
Validated final head -> {VALIDATED_HEAD}
Formal merge -> {FORMAL_MERGE}
```

已实现：

- Obsidian CLI 单一实现迁入 `src/obsidian/`。
- `second_brain/obsidian_cli.py` 降为兼容转发，不再持有独立执行逻辑。
- Runtime Settings 增加启用、CLI 路径、Vault 回退路径、名称、超时和 Dry Run。
- CLI 发现支持 Runtime Settings、环境变量、PATH 和平台标准位置。
- Workspace Vault 保持路径权威，不绕过 Production/Acceptance 隔离。
- 8766 增加 `/api/obsidian/status`、`/validate` 和 `/refresh`。
- Tauri 增加 Obsidian 状态与设置页，使用官方 Dialog Plugin。
- 状态 DTO 只返回掩码路径和稳定错误，不暴露原始绝对路径。
- create/append 使用相对路径边界并执行写后读取验证。

最终门禁：

```text
Linux Python 3.12: 405 passed / 11 skipped / 0 failed / 2 warnings / 10.31s
Windows Python 3.12: 405 passed / 11 skipped / 0 failed / 2 warnings / 71.77s
npm ci: PASS
npm run test:obsidian: PASS
npm run test:smoke: PASS
npm run build: PASS
cargo check: PASS
formal PR tests: SUCCESS
formal PR P0 Windows Gate: SUCCESS
```

完整报告：

```text
docs/MODULES/P2_06_OBSIDIAN_CLI_MIGRATION_IMPLEMENTATION.md
docs/TEST_REPORTS/P2_06_OBSIDIAN_CLI_MIGRATION_TEST_REPORT.md
```

'''
          patch(
              "docs/PROJECT_STATUS.md",
              "## 7. 安全状态",
              p206_section + "## 8. 安全状态",
          )
          patch("docs/PROJECT_STATUS.md", "## 8. 当前状态", "## 9. 当前状态")
          patch("docs/PROJECT_STATUS.md", "## 9. 下一步", "## 10. 下一步")
          patch(
              "docs/PROJECT_STATUS.md",
              "P2-05 Manual Capture Center:\nMERGED_AND_VALIDATED\n",
              "P2-05 Manual Capture Center:\nMERGED_AND_VALIDATED\n\n"
              "P2-06 Obsidian CLI Formal Migration:\nMERGED_AND_VALIDATED\n",
          )
          patch(
              "docs/PROJECT_STATUS.md",
              "Obsidian CLI 正式迁入 src\n-> 接入 8766 Local Control API\n-> 接入 Runtime Settings\n-> 接入 Tauri 状态与设置入口\n-> 保持 second_brain 仅为兼容层",
              "Schema v2 + Evidence Layer\n"
              "-> Revision / Conflict / Owner Review\n"
              "-> Retrieval Evaluation 与关系扩展\n"
              "-> 微信、本地文件和其他 AI Adapter\n"
              "-> AI Access Center 与主动第二大脑",
          )

          patch(
              "docs/MODULES/CODE_MAP.md",
              "> P2-05 Status（P2-05 状态）: `MERGED_AND_VALIDATED`",
              "> P2-05 Status（P2-05 状态）: `MERGED_AND_VALIDATED`  \n"
              f"> P2-06 Validated Head（P2-06 已验证提交）: `{VALIDATED_HEAD}`  \n"
              f"> P2-06 Formal Merge Commit（P2-06 正式合并提交）: `{FORMAL_MERGE}`  \n"
              "> P2-06 Status（P2-06 状态）: `MERGED_AND_VALIDATED`",
          )
          old_obsidian = '''## 12. Obsidian CLI 兼容层

```text
second_brain/obsidian_cli.py
```

发现顺序：

```text
OBSIDIAN_CLI_PATH
-> PATH
-> platform location
-> not_found
```

正式迁移目标：

```text
src/obsidian/
  config.py
  discovery.py
  models.py
  client.py
  service.py
```
'''
          new_obsidian = '''## 12. Obsidian 正式包与兼容层

正式入口：

```text
src/obsidian/models.py
src/obsidian/discovery.py
src/obsidian/config.py
src/obsidian/client.py::ObsidianCliClient
src/obsidian/service.py::ObsidianService
src/obsidian/management.py
src/obsidian/system_ui.py
```

兼容入口：

```text
second_brain/obsidian_cli.py
= deprecated facade -> src.obsidian
```

发现顺序：

```text
Runtime Settings explicit path
-> OBSIDIAN_CLI_PATH
-> PATH
-> platform-standard location
-> not_found
```

8766 API：

```text
GET  /api/obsidian/status
POST /api/obsidian/validate
POST /api/obsidian/refresh
```

状态 API 使用掩码路径；Desktop 不直接启动 CLI。
'''
          patch("docs/MODULES/CODE_MAP.md", old_obsidian, new_obsidian)
          patch(
              "docs/MODULES/CODE_MAP.md",
              "P2-05 Capture Center：\n\n```text\ndesktop/lingji-control/src/pages/CaptureCenterPage.tsx\ndesktop/lingji-control/src/pages/captureCenterApi.ts\ndesktop/lingji-control/src/pages/captureCenterContract.ts\ndesktop/lingji-control/src/pages/captureCenterTypes.ts\ndesktop/lingji-control/scripts/capture-center-smoke.mjs\n```",
              "P2-05 Capture Center：\n\n```text\ndesktop/lingji-control/src/pages/CaptureCenterPage.tsx\ndesktop/lingji-control/src/pages/captureCenterApi.ts\ndesktop/lingji-control/src/pages/captureCenterContract.ts\ndesktop/lingji-control/src/pages/captureCenterTypes.ts\ndesktop/lingji-control/scripts/capture-center-smoke.mjs\n```\n\nP2-06 Obsidian：\n\n```text\ndesktop/lingji-control/src/pages/ObsidianPage.tsx\ndesktop/lingji-control/scripts/obsidian-smoke.mjs\n```",
          )
          patch(
              "docs/MODULES/CODE_MAP.md",
              "formal PR P0 Windows Gate: SUCCESS\n```",
              "formal PR P0 Windows Gate: SUCCESS\n```\n\nP2-06 最终验证：\n\n```text\nLinux full pytest: 405 passed / 11 skipped / 0 failed\nWindows full pytest: 405 passed / 11 skipped / 0 failed\nnpm run test:obsidian: PASS\nnpm run test:smoke: PASS\nnpm run build: PASS\ncargo check: PASS\nformal PR tests: SUCCESS\nformal PR P0 Windows Gate: SUCCESS\n```",
          )
          patch(
              "docs/MODULES/CODE_MAP.md",
              "P2-05 Manual Capture Center:\nMERGED_AND_VALIDATED\n```",
              "P2-05 Manual Capture Center:\nMERGED_AND_VALIDATED\n\n"
              "P2-06 Obsidian CLI Formal Migration:\nMERGED_AND_VALIDATED\n```\n\n"
              "## 17. P2-06 合并记录\n\n```text\n"
              f"Validated implementation: {IMPLEMENTATION}\n"
              f"Validated final head: {VALIDATED_HEAD}\n"
              f"Formal merge: {FORMAL_MERGE}\n```",
          )

          changelog_section = f'''### P2-06 Obsidian CLI 正式迁移

- 将 Obsidian CLI 单一实现迁入 `src/obsidian/`，按 models、discovery、config、client、service 分层。
- 保留既有 `management.py` 和 `system_ui.py`，未复制第二套 Vault 管理能力。
- 将 `second_brain/obsidian_cli.py` 降为兼容转发，删除约400行重复命令实现。
- 增加 Runtime Settings 的启用、CLI/Vault 路径、Vault 名称、超时和 Dry Run。
- 增加认证的 8766 Obsidian 状态、配置草稿校验和刷新接口。
- 增加 Tauri Obsidian 页面、官方 Dialog Plugin 路径选择和独立 Smoke Test。
- 状态 API 不返回原始 CLI/Vault 绝对路径；Client 拒绝绝对路径和 `..` 越界。
- Linux Python 3.12：`405 passed, 11 skipped, 0 failed`，10.31 秒。
- Windows Python 3.12：`405 passed, 11 skipped, 0 failed`，71.77 秒。
- `npm ci`、Obsidian Smoke、全部 Desktop Smoke、Build 和 `cargo check` 通过。
- 已验证实现提交：`{IMPLEMENTATION}`；最终已验证 HEAD：`{VALIDATED_HEAD}`。
- 正式合并提交：`{FORMAL_MERGE}`。
- 未访问生产 Vault、SQLite、Qdrant 或 Ollama；未修改数据库 Schema；未新增监听、手机端或浏览器扩展。

'''
          patch(
              "docs/CHANGELOG.md",
              "## 2026-07-21\n\n### P2-05 Manual Capture Center 集成验证",
              "## 2026-07-21\n\n" + changelog_section + "### P2-05 Manual Capture Center 集成验证",
          )

          patch(
              "docs/MODULES/OBSIDIAN_CLI_MIGRATION_PLAN.md",
              f"> Validated Commit（已验证提交）: `{IMPLEMENTATION}`  \n> Status（状态）: `IMPLEMENTED_COORDINATOR_VALIDATED`",
              f"> Validated Implementation Commit（已验证实现提交）: `{IMPLEMENTATION}`  \n"
              f"> Final Validated Head（最终已验证提交）: `{VALIDATED_HEAD}`  \n"
              f"> Formal Merge Commit（正式合并提交）: `{FORMAL_MERGE}`  \n"
              "> Status（状态）: `MERGED_AND_VALIDATED`",
          )
          patch(
              "docs/MODULES/P2_06_OBSIDIAN_CLI_MIGRATION_IMPLEMENTATION.md",
              "> Status: `IMPLEMENTED_COORDINATOR_VALIDATED`  \n> Branch: `work/p2-06-obsidian-cli-migration`",
              "> Status: `MERGED_AND_VALIDATED`  \n"
              "> Formal Branch: `feature/second-brain-memory`  \n"
              f"> Formal Merge Commit: `{FORMAL_MERGE}`  \n"
              "> Source Branch: `work/p2-06-obsidian-cli-migration`",
          )
          patch(
              "docs/TEST_REPORTS/P2_06_OBSIDIAN_CLI_MIGRATION_TEST_REPORT.md",
              "> Status: `FORMAL_CI_VALIDATED`  \n> Validated Implementation Commit:",
              "> Status: `MERGED_AND_VALIDATED`  \n"
              f"> Formal Merge Commit: `{FORMAL_MERGE}`  \n"
              "> Validated Implementation Commit:",
          )
          PY

      - name: Commit formal documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/MODULES/CODE_MAP.md docs/CHANGELOG.md docs/MODULES/OBSIDIAN_CLI_MIGRATION_PLAN.md docs/MODULES/P2_06_OBSIDIAN_CLI_MIGRATION_IMPLEMENTATION.md docs/TEST_REPORTS/P2_06_OBSIDIAN_CLI_MIGRATION_TEST_REPORT.md
          git diff --cached --check
          git commit -m "docs(p2-06): record formal Obsidian migration"
          git push origin HEAD:feature/second-brain-memory

      - name: Report success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 17 --repo ${{ github.repository }} --body "P2-06 formal documentation finalized. Formal merge: `5ce10ed8be98784f57e8723ffc27e40e3abaffbc`."

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 17 --repo ${{ github.repository }} --body "P2-06 documentation finalizer failed in run `${{ github.run_id }}`. Code merge remains intact; documentation was not claimed complete."
