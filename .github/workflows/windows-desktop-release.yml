name: Windows Desktop Release Baseline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel recorded in metadata
        required: true
        default: development
        type: choice
        options:
          - development
          - acceptance
          - release-candidate
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches:
      - master
    paths:
      - "desktop/lingji-control/**"
      - "src/**"
      - "run_control_api.py"
      - "run_packaged_control_api.py"
      - "requirements*.txt"
      - "scripts/build_windows_sidecar.ps1"
      - ".github/workflows/windows-desktop-release.yml"

permissions:
  contents: read

concurrency:
  group: windows-desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build Windows Desktop and packaged runtime
    runs-on: windows-latest
    timeout-minutes: 75

    defaults:
      run:
        working-directory: desktop/lingji-control

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/lingji-control/package-lock.json
          package-manager-cache: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sidecar-build.txt

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/lingji-control/src-tauri -> target

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$config.version
          $commit = "${{ github.event.pull_request.head.sha || github.sha }}"
          $eventName = "${{ github.event_name }}"
          $channel = "pr"
          if ($eventName -eq "workflow_dispatch") {
            $channel = "${{ inputs.channel }}"
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $channel = "release"
            $expectedTag = "desktop-v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match Desktop version $expectedTag"
            }
          }
          $buildTime = (Get-Date).ToUniversalTime().ToString("o")
          $shortCommit = $commit.Substring(0, [Math]::Min(8, $commit.Length))
          "LINGJI_BUILD_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LINGJI_BUILD_TIME_UTC=$buildTime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LINGJI_BUILD_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LINGJI_BUILD_TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LINGJI_BUILD_SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LINGJI_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LINGJI_BUILD_COMMIT_SHORT=$shortCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Run Desktop smoke tests
        run: npm run test:smoke

      - name: Build Desktop frontend for Tauri context
        run: npm run build

      - name: Test Rust runtime manager
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/runtime-validation -Force | Out-Null
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc *>&1 |
            Tee-Object -FilePath release/runtime-validation/cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Rust validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lingji-runtime-rust-validation-${{ env.LINGJI_BUILD_COMMIT_SHORT }}
          path: |
            desktop/lingji-control/src-tauri/Cargo.lock
            desktop/lingji-control/release/runtime-validation/cargo-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Install packaged runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../../requirements-sidecar-build.txt
          python -m pip check

      - name: Validate packaged runtime Python contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r ../../requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest ../../tests/test_packaged_control_api.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkRoot = Join-Path $env:RUNNER_TEMP "lingji-contract"
          python ../../run_packaged_control_api.py --data-root $checkRoot --check-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build packaged Python runtime
        shell: pwsh
        run: |
          ../../scripts/build_windows_sidecar.ps1 -TargetTriple x86_64-pc-windows-msvc

      - name: Verify authenticated health and managed stop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sidecar = Resolve-Path "../../build/sidecar/dist/lingji-core/lingji-core.exe"
          $dataRoot = Join-Path $env:RUNNER_TEMP "lingji-sidecar-acceptance"
          if (Test-Path $dataRoot) { Remove-Item $dataRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          $process = Start-Process -FilePath $sidecar -ArgumentList @(
            "--data-root", $dataRoot,
            "--host", "127.0.0.1",
            "--port", "8766"
          ) -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            $lastHealthError = ""
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged runtime exited before becoming healthy: $($process.ExitCode)"
              }
              $tokenPath = Join-Path $dataRoot "storage/control_api_token"
              $statePath = Join-Path $dataRoot "runtime/sidecar-state.json"
              if (-not (Test-Path $tokenPath) -or -not (Test-Path $statePath)) { continue }
              $token = (Get-Content $tokenPath -Raw -Encoding UTF8).Trim()
              if ([string]::IsNullOrWhiteSpace($token)) { continue }
              $healthOutput = & curl.exe `
                --fail `
                --silent `
                --show-error `
                --max-time 2 `
                --header "X-LingJi-Token: $token" `
                "http://127.0.0.1:8766/api/runtime/ping" 2>&1
              if ($LASTEXITCODE -eq 0) {
                $healthy = $true
                break
              }
              $lastHealthError = ($healthOutput | Out-String).Trim()
            }
            if (-not $healthy) {
              Write-Host "Packaged runtime health diagnostics:"
              Write-Host "  process_id=$($process.Id) has_exited=$($process.HasExited)"
              Write-Host "  token_exists=$(Test-Path (Join-Path $dataRoot "storage/control_api_token"))"
              Write-Host "  state_exists=$(Test-Path (Join-Path $dataRoot "runtime/sidecar-state.json"))"
              Write-Host "  last_health_error=$lastHealthError"
              Get-ChildItem $dataRoot -Recurse -Force | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize
              Get-NetTCPConnection -LocalPort 8766 -ErrorAction SilentlyContinue | Format-Table -AutoSize
              throw "Packaged runtime did not pass authenticated health"
            }

            $state = Get-Content (Join-Path $dataRoot "runtime/sidecar-state.json") -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($state.mode -ne "packaged_sidecar" -or [string]::IsNullOrWhiteSpace($state.instance_id)) {
              throw "Packaged runtime did not publish a valid identity"
            }
            $stopRequest = [ordered]@{
              schema_version = 1
              instance_id = [string]$state.instance_id
              requested_at_ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            }
            $stopRequest | ConvertTo-Json | Set-Content `
              -Path (Join-Path $dataRoot "runtime/sidecar-stop-request.json") `
              -Encoding UTF8

            for ($attempt = 0; $attempt -lt 80 -and -not $process.HasExited; $attempt++) {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
            }
            if (-not $process.HasExited) { throw "Packaged runtime ignored the matching stop request" }
            if (Test-Path (Join-Path $dataRoot "runtime/sidecar-state.json")) {
              throw "Packaged runtime left stale identity after managed stop"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Build Tauri NSIS installer with packaged runtime
        run: npm run tauri build -- --config src-tauri/tauri.sidecar.conf.json --bundles nsis --target x86_64-pc-windows-msvc

      - name: Package installer, executable and checksums
        shell: pwsh
        run: |
          ./scripts/package-windows-release.ps1 `
            -Commit "$env:LINGJI_BUILD_COMMIT" `
            -BuildTimeUtc "$env:LINGJI_BUILD_TIME_UTC" `
            -Channel "$env:LINGJI_BUILD_CHANNEL" `
            -Target "$env:LINGJI_BUILD_TARGET"

      - name: Verify release artifact contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "release/windows-x64"
          $installer = Get-ChildItem $release -Filter "*_setup.exe" -File
          if ($installer.Count -ne 1 -or $installer[0].Length -le 0) {
            throw "Expected one non-empty NSIS installer"
          }
          foreach ($required in @(
            "build-metadata.json",
            "SHA256SUMS.txt",
            "INSTALLATION-NOTES.txt",
            "lingji-core-manifest.json"
          )) {
            if (-not (Test-Path (Join-Path $release $required))) {
              throw "Missing release file: $required"
            }
          }
          $metadata = Get-Content (Join-Path $release "build-metadata.json") -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($metadata.commit -ne $env:LINGJI_BUILD_COMMIT) { throw "Commit metadata mismatch" }
          if ($metadata.version -ne $env:LINGJI_RELEASE_VERSION) { throw "Version metadata mismatch" }
          if ($metadata.signed -ne $false) { throw "Unsigned baseline must not claim code signing" }
          if ($metadata.runtime_boundary.python_sidecar_included -ne $true) { throw "Packaged runtime is missing" }
          if ($metadata.runtime_boundary.pyinstaller_mode -ne "onedir") { throw "Unexpected sidecar mode" }
          if ($metadata.runtime_boundary.updater_included -ne $false) { throw "Updater must remain disabled" }

      - name: Upload Windows Desktop and runtime
        uses: actions/upload-artifact@v7
        with:
          name: lingji-windows-${{ env.LINGJI_RELEASE_VERSION }}-${{ env.LINGJI_BUILD_COMMIT_SHORT }}
          path: desktop/lingji-control/release/windows-x64/*
          if-no-files-found: error
          retention-days: 14
