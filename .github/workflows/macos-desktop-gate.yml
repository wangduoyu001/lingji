name: macOS Desktop Gate

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos-desktop-gate.yml'
      - 'desktop/lingji-control/**'
      - 'scripts/build_macos_sidecar.sh'
      - 'run_packaged_control_api.py'
      - 'run_control_api.py'
      - 'src/**'
      - 'requirements*.txt'
  pull_request:
    paths:
      - 'desktop/lingji-control/**'
      - 'scripts/build_macos_sidecar.sh'
      - 'run_packaged_control_api.py'
      - 'run_control_api.py'
      - 'src/**'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-silicon-build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify native Python
        run: |
          python3 - <<'PY'
          import platform
          assert platform.machine() in {'arm64', 'aarch64'}, platform.machine()
          print(platform.python_version(), platform.machine())
          PY

      - name: Install Python sidecar dependencies
        run: python3 -m pip install -r requirements-sidecar-build.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/lingji-control/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop/lingji-control
        run: npm ci

      - name: Static macOS release smoke
        working-directory: desktop/lingji-control
        run: npm run test:macos-release

      - name: Build desktop frontend
        working-directory: desktop/lingji-control
        run: npm run build

      - name: Setup Rust target
        run: |
          rustup target add aarch64-apple-darwin
          rustc -Vv

      - name: Build Apple Silicon sidecar
        working-directory: desktop/lingji-control
        run: npm run build:sidecar:macos

      - name: Rust unit tests
        working-directory: desktop/lingji-control/src-tauri
        run: cargo test --target aarch64-apple-darwin

      - name: Build Apple Silicon app bundle
        working-directory: desktop/lingji-control
        env:
          LINGJI_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          LINGJI_BUILD_CHANNEL: ci-macos
          LINGJI_BUILD_TARGET: aarch64-apple-darwin
          LINGJI_BUILD_SIGNED: 'false'
        run: npx tauri build --config src-tauri/tauri.sidecar.conf.json --bundles app --target aarch64-apple-darwin

      - name: Verify embedded product identity
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_DIR="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          MAIN_BINARY="$(find "$APP_DIR/Contents/MacOS" -maxdepth 1 -type f | head -n 1)"
          test -n "$MAIN_BINARY"
          file "$MAIN_BINARY" | grep -E 'arm64|arm64e' >/dev/null
          "$MAIN_BINARY" --release-metadata-output "$RUNNER_TEMP/release_metadata.json"
          python3 - <<PY
          import json
          from pathlib import Path
          payload = json.loads(Path("$RUNNER_TEMP/release_metadata.json").read_text(encoding="utf-8"))
          assert payload["commit"] == "$EXPECTED", payload
          assert payload["target"] == "aarch64-apple-darwin", payload
          assert payload["installer_format"] == "dmg", payload
          PY

      - name: Verify packaged sidecar contract
        run: |
          set -euo pipefail
          test -x desktop/lingji-control/src-tauri/binaries/lingji-core-aarch64-apple-darwin
          test -d desktop/lingji-control/src-tauri/binaries/lingji_core_lib
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_DIR="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_DIR"
          PACKAGED_SIDECAR="$APP_DIR/Contents/Resources/lingji-core.exe"
          test -x "$PACKAGED_SIDECAR"
          test -d "$APP_DIR/Contents/Resources/lingji_core_lib"
          file "$PACKAGED_SIDECAR" | grep -E 'arm64|arm64e' >/dev/null
          CONTRACT_ROOT="$RUNNER_TEMP/lingji-packaged-contract"
          mkdir -p "$CONTRACT_ROOT"
          "$PACKAGED_SIDECAR" \
            --data-root "$CONTRACT_ROOT" \
            --check-config \
            --check-config-output "$CONTRACT_ROOT/contract.json"
          python3 - <<PY
          import json
          from pathlib import Path
          payload = json.loads(Path("$CONTRACT_ROOT/contract.json").read_text(encoding="utf-8"))
          assert payload["mode"] == "packaged_sidecar", payload
          assert payload["host"] == "127.0.0.1", payload
          assert payload["owner_data_outside_install_dir"] is True, payload
          PY

      - name: Boot packaged control API
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_DIR="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          PACKAGED_SIDECAR="$APP_DIR/Contents/Resources/lingji-core.exe"
          DATA_ROOT="$RUNNER_TEMP/lingji-packaged-runtime"
          mkdir -p "$DATA_ROOT"
          "$PACKAGED_SIDECAR" --data-root "$DATA_ROOT" --host 127.0.0.1 --port 8766 >"$RUNNER_TEMP/lingji-sidecar.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do
            if [[ -s "$DATA_ROOT/storage/control_api_token" ]]; then
              TOKEN="$(cat "$DATA_ROOT/storage/control_api_token")"
              if curl --silent --fail -H "X-LingJi-Token: $TOKEN" http://127.0.0.1:8766/api/runtime/ping >/dev/null; then
                exit 0
              fi
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/lingji-sidecar.log" >&2
          exit 1

      - name: Create DMG from verified app build
        working-directory: desktop/lingji-control
        env:
          LINGJI_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          LINGJI_BUILD_CHANNEL: ci-macos
          LINGJI_BUILD_TARGET: aarch64-apple-darwin
          LINGJI_BUILD_SIGNED: 'false'
        run: npx tauri bundle --config src-tauri/tauri.sidecar.conf.json --bundles dmg --target aarch64-apple-darwin

      - name: Mount and verify final DMG
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG="$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)"
          test -n "$DMG"
          MOUNT_POINT="$RUNNER_TEMP/lingji-dmg-mount"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -readonly
          trap 'hdiutil detach "$MOUNT_POINT" -force >/dev/null 2>&1 || true' EXIT
          APP_DIR="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_DIR"
          test -x "$APP_DIR/Contents/Resources/lingji-core.exe"
          test -d "$APP_DIR/Contents/Resources/lingji_core_lib"
          codesign --verify --deep --strict "$APP_DIR"
          MAIN_BINARY="$(find "$APP_DIR/Contents/MacOS" -maxdepth 1 -type f | head -n 1)"
          test -n "$MAIN_BINARY"
          file "$MAIN_BINARY" | grep -E 'arm64|arm64e' >/dev/null
          file "$APP_DIR/Contents/Resources/lingji-core.exe" | grep -E 'arm64|arm64e' >/dev/null
          "$MAIN_BINARY" --release-metadata-output "$RUNNER_TEMP/dmg-release_metadata.json"
          cmp "$RUNNER_TEMP/release_metadata.json" "$RUNNER_TEMP/dmg-release_metadata.json"
          python3 - <<PY
          import json
          from pathlib import Path
          payload = json.loads(Path("$RUNNER_TEMP/dmg-release_metadata.json").read_text(encoding="utf-8"))
          assert payload["commit"] == "$EXPECTED", payload
          assert payload["target"] == "aarch64-apple-darwin", payload
          assert payload["installer_format"] == "dmg", payload
          PY
          CONTRACT_ROOT="$RUNNER_TEMP/lingji-dmg-contract"
          mkdir -p "$CONTRACT_ROOT"
          "$APP_DIR/Contents/Resources/lingji-core.exe" \
            --data-root "$CONTRACT_ROOT" \
            --check-config \
            --check-config-output "$CONTRACT_ROOT/contract.json"
          python3 - <<PY
          import json
          from pathlib import Path
          payload = json.loads(Path("$CONTRACT_ROOT/contract.json").read_text(encoding="utf-8"))
          assert payload["mode"] == "packaged_sidecar", payload
          assert payload["owner_data_outside_install_dir"] is True, payload
          PY
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

      - name: Verify installed App acceptance isolation
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG="$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name '*.dmg' -type f | head -n 1)"
          MOUNT_POINT="$RUNNER_TEMP/lingji-isolation-dmg-mount"
          TASK_ROOT="$RUNNER_TEMP/lingji-installed-app-acceptance"
          mkdir -p "$MOUNT_POINT" "$TASK_ROOT/isolated-home" "$TASK_ROOT/runtime-data"
          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -readonly
          APP_DIR="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          MAIN_BINARY="$(find "$APP_DIR/Contents/MacOS" -maxdepth 1 -type f | head -n 1)"
          test -n "$MAIN_BINARY"
          launch() {
            HOME="$TASK_ROOT/isolated-home" \
            LINGJI_ACCEPTANCE_DATA_ROOT="$TASK_ROOT/runtime-data" \
              "$MAIN_BINARY" >"$TASK_ROOT/desktop-launch.log" 2>&1 &
            DESKTOP_PID=$!
            for _ in $(seq 1 80); do
              if [[ -s "$TASK_ROOT/runtime-data/storage/control_api_token" ]]; then
                TOKEN="$(cat "$TASK_ROOT/runtime-data/storage/control_api_token")"
                if curl --silent --fail -H "X-LingJi-Token: $TOKEN" http://127.0.0.1:8766/api/runtime/ping >/dev/null; then
                  return 0
                fi
              fi
              sleep 0.25
            done
            cat "$TASK_ROOT/desktop-launch.log" >&2
            return 1
          }
          cleanup_runtime() {
            kill "$DESKTOP_PID" 2>/dev/null || true
            wait "$DESKTOP_PID" 2>/dev/null || true
          }
          trap 'cleanup_runtime; hdiutil detach "$MOUNT_POINT" -force >/dev/null 2>&1 || true' EXIT
          launch
          cleanup_runtime
          launch
          cleanup_runtime
          python3 - <<PY
          from pathlib import Path
          task_root = Path("$TASK_ROOT").resolve()
          data_root = task_root / "runtime-data"
          required = ["storage", "logs", "runtime", "raw", "qdrant"]
          assert all((data_root / name).exists() for name in required), required
          assert not (task_root / "isolated-home" / "Documents" / "acceptance").exists()
          for path in task_root.rglob("*"):
              assert path.is_relative_to(task_root), path
          PY
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v6
        with:
          name: lingji-macos-arm64
          if-no-files-found: error
          path: desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
