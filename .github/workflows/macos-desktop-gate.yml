name: macOS Desktop Gate

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos-desktop-gate.yml'
      - 'desktop/lingji-control/**'
      - 'scripts/build_macos_sidecar.sh'
      - 'run_packaged_control_api.py'
      - 'run_control_api.py'
      - 'src/**'
      - 'requirements*.txt'
  pull_request:
    paths:
      - 'desktop/lingji-control/**'
      - 'scripts/build_macos_sidecar.sh'
      - 'run_packaged_control_api.py'
      - 'run_control_api.py'
      - 'src/**'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-silicon-build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify native Python
        run: |
          python3 - <<'PY'
          import platform
          assert platform.machine() in {'arm64', 'aarch64'}, platform.machine()
          print(platform.python_version(), platform.machine())
          PY

      - name: Install Python sidecar dependencies
        run: python3 -m pip install -r requirements-sidecar-build.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/lingji-control/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop/lingji-control
        run: npm ci

      - name: Static macOS release smoke
        working-directory: desktop/lingji-control
        run: npm run test:macos-release

      - name: Build desktop frontend
        working-directory: desktop/lingji-control
        run: npm run build

      - name: Setup Rust target
        run: |
          rustup target add aarch64-apple-darwin
          rustc -Vv

      - name: Build Apple Silicon sidecar
        working-directory: desktop/lingji-control
        run: npm run build:sidecar:macos

      - name: Rust unit tests
        working-directory: desktop/lingji-control/src-tauri
        run: cargo test --target aarch64-apple-darwin

      - name: Build Apple Silicon app bundle
        working-directory: desktop/lingji-control
        env:
          LINGJI_BUILD_COMMIT: ${{ github.sha }}
          LINGJI_BUILD_CHANNEL: ci-macos
          LINGJI_BUILD_TARGET: aarch64-apple-darwin
          LINGJI_BUILD_SIGNED: 'false'
        run: npx tauri build --config src-tauri/tauri.sidecar.conf.json --bundles app --target aarch64-apple-darwin

      - name: Verify packaged sidecar contract
        run: |
          set -euo pipefail
          test -x desktop/lingji-control/src-tauri/binaries/lingji-core-aarch64-apple-darwin
          test -d desktop/lingji-control/src-tauri/binaries/lingji_core_lib
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_DIR="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_DIR"
          PACKAGED_SIDECAR="$APP_DIR/Contents/Resources/lingji-core.exe"
          test -x "$PACKAGED_SIDECAR"
          test -d "$APP_DIR/Contents/Resources/lingji_core_lib"
          CONTRACT_ROOT="$RUNNER_TEMP/lingji-packaged-contract"
          mkdir -p "$CONTRACT_ROOT"
          "$PACKAGED_SIDECAR" \
            --data-root "$CONTRACT_ROOT" \
            --check-config \
            --check-config-output "$CONTRACT_ROOT/contract.json"
          python3 - <<PY
          import json
          from pathlib import Path
          payload = json.loads(Path("$CONTRACT_ROOT/contract.json").read_text(encoding="utf-8"))
          assert payload["mode"] == "packaged_sidecar", payload
          assert payload["host"] == "127.0.0.1", payload
          assert payload["owner_data_outside_install_dir"] is True, payload
          PY

      - name: Boot packaged control API
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_DIR="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          PACKAGED_SIDECAR="$APP_DIR/Contents/Resources/lingji-core.exe"
          DATA_ROOT="$RUNNER_TEMP/lingji-packaged-runtime"
          mkdir -p "$DATA_ROOT"
          "$PACKAGED_SIDECAR" --data-root "$DATA_ROOT" --host 127.0.0.1 --port 8766 >"$RUNNER_TEMP/lingji-sidecar.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do
            if [[ -s "$DATA_ROOT/storage/control_api_token" ]]; then
              TOKEN="$(cat "$DATA_ROOT/storage/control_api_token")"
              if curl --silent --fail -H "X-LingJi-Token: $TOKEN" http://127.0.0.1:8766/api/runtime/ping >/dev/null; then
                exit 0
              fi
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/lingji-sidecar.log" >&2
          exit 1

      - name: Create DMG from verified app build
        working-directory: desktop/lingji-control
        env:
          LINGJI_BUILD_COMMIT: ${{ github.sha }}
          LINGJI_BUILD_CHANNEL: ci-macos
          LINGJI_BUILD_TARGET: aarch64-apple-darwin
          LINGJI_BUILD_SIGNED: 'false'
        run: npx tauri bundle --config src-tauri/tauri.sidecar.conf.json --bundles dmg --target aarch64-apple-darwin

      - name: Verify DMG
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle"
          find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name '*.dmg' -type f -print | tee "$RUNNER_TEMP/dmg-files.txt"
          test -s "$RUNNER_TEMP/dmg-files.txt"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v6
        with:
          name: lingji-macos-arm64
          if-no-files-found: error
          path: desktop/lingji-control/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
