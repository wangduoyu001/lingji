name: P2-05A Coordinated Review Fix

on:
  push:
    branches:
      - work/p2-05a-capture-control-api
  pull_request:
    branches:
      - feature/second-brain-memory
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ui.txt
            requirements-test.txt
            requirements-mcp.txt
            constraints/python-3.12-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            -r requirements-ui.txt `
            -r requirements-test.txt `
            -r requirements-mcp.txt `
            -c constraints/python-3.12-windows.txt

      - name: Apply coordinated contract fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          api_path = Path("src/control/api.py")
          api = api_path.read_text(encoding="utf-8")
          api = api.replace("import hmac\nimport logging\nfrom typing import Any\n", "import hmac\nimport json\nimport logging\nfrom datetime import datetime, timezone\nfrom typing import Any, Mapping\n")
          api = api.replace(
              "class CaptureMediaRequest(CaptureCommonRequest):\n    input_path: str = Field(min_length=1)\n    allow_ocr: bool = False\n    allow_transcription: bool = False\n    extract_keyframes: bool = False\n",
              "class CaptureMediaRequest(CaptureCommonRequest):\n    input_path: str = Field(min_length=1)\n    allow_ocr: bool = False\n    allow_transcription: bool = False\n    extract_keyframes: bool = False\n    extract_audio: bool = False\n",
          )
          marker = "\ndef _register_capture_routes(app: Any, settings: Any, control: Any, *, token: str) -> None:\n"
          helpers = r'''

          _CAPTURE_JOB_STATUSES = ("queued", "running", "retrying", "completed", "failed", "cancelled")


          def _normalize_result_refs(value: Any) -> dict[str, str] | None:
              if isinstance(value, Mapping):
                  result = {
                      key: str(value[key])
                      for key in ("memory_id", "source_id", "conversation_id", "message_id")
                      if isinstance(value.get(key), str) and value.get(key)
                  }
                  return result or None
              if isinstance(value, list):
                  result: dict[str, str] = {}
                  for item in value:
                      if not isinstance(item, Mapping):
                          continue
                      ref_type = str(item.get("type") or "").strip()
                      ref_id = str(item.get("id") or "").strip()
                      key = f"{ref_type}_id" if ref_type in {"memory", "source", "conversation", "message"} else ""
                      if key and ref_id:
                          result[key] = ref_id
                  return result or None
              return None


          def _normalize_job_payload(payload: Mapping[str, Any]) -> dict[str, Any]:
              result = dict(payload)
              result["result_refs"] = _normalize_result_refs(result.get("result_refs"))
              summary = result.get("result_summary")
              if isinstance(summary, Mapping):
                  result["result_summary"] = json.dumps(dict(summary), ensure_ascii=False, sort_keys=True)
              elif summary is not None and not isinstance(summary, str):
                  result["result_summary"] = str(summary)
              return result


          def _normalize_jobs_payload(payload: Mapping[str, Any]) -> dict[str, Any]:
              result = dict(payload)
              items = payload.get("items")
              result["items"] = [
                  _normalize_job_payload(item)
                  for item in items
                  if isinstance(item, Mapping)
              ] if isinstance(items, list) else []
              return result


          def _normalize_status_payload(payload: Mapping[str, Any]) -> dict[str, Any]:
              result = dict(payload)
              raw_mode = str(payload.get("capture_mode") or payload.get("mode") or "low_power").strip().lower()
              mode = raw_mode if raw_mode in {"normal", "low_power", "paused"} else "low_power"
              queue = payload.get("queue") if isinstance(payload.get("queue"), Mapping) else {}
              result["capture_mode"] = mode
              result["mode"] = mode
              result["mode_label"] = mode.upper()
              result["paused"] = mode == "paused"
              result["worker_state"] = str(payload.get("worker_state") or "available")
              result["updated_at"] = payload.get("updated_at") or datetime.now(timezone.utc).isoformat()
              for status in _CAPTURE_JOB_STATUSES:
                  value = queue.get(status, payload.get(status))
                  result[status] = int(value) if isinstance(value, (int, float)) else None
              return result


          def _normalize_capabilities_payload(payload: Mapping[str, Any], service: Any) -> dict[str, Any]:
              result = dict(payload)
              mode = str(payload.get("capture_mode") or "low_power").strip().lower()
              capture_service = getattr(service, "capture_service", None)
              policy = getattr(capture_service, "policy", None)
              heavy_allowed = bool(policy.permits_heavy_media()) if policy is not None else False
              result["state"] = "paused" if mode == "paused" else "healthy"
              result["file_modes"] = ["web_snapshot", "chatgpt_export", "codex_report"]
              result["media"] = {
                  "ocr": bool(getattr(policy, "allow_ocr", False)),
                  "transcription": bool(getattr(policy, "allow_video_transcription", False)),
                  "keyframes": heavy_allowed,
                  "extract_audio": heavy_allowed,
                  "reasons": {} if heavy_allowed else {"low_power": "当前采集策略禁止重媒体处理"},
              }
              return result
          '''
          helpers = "\n".join(line[10:] if line.startswith("          ") else line for line in helpers.splitlines())
          if "def _normalize_status_payload" not in api:
              if marker not in api:
                  raise SystemExit("capture route marker not found")
              api = api.replace(marker, helpers + marker)
          api = api.replace("            return capture_control().status()", "            return _normalize_status_payload(capture_control().status())")
          api = api.replace("            return capture_control().capabilities()", "            service = capture_control()\n            return _normalize_capabilities_payload(service.capabilities(), service)")
          api = api.replace("            return capture_control().list_jobs(\n", "            return _normalize_jobs_payload(capture_control().list_jobs(\n")
          api = api.replace("                offset=offset,\n            )\n        except Exception as exc:\n            raise translate(exc) from exc\n\n    @app.get(\"/api/capture/jobs/{job_id}\"", "                offset=offset,\n            ))\n        except Exception as exc:\n            raise translate(exc) from exc\n\n    @app.get(\"/api/capture/jobs/{job_id}\"")
          api = api.replace("            return capture_control().get_job(job_id)", "            return _normalize_job_payload(capture_control().get_job(job_id))")
          api = api.replace("            return capture_control().retry_job(job_id)", "            return _normalize_job_payload(capture_control().retry_job(job_id))")
          api = api.replace("            return capture_control().cancel_job(job_id)", "            return _normalize_job_payload(capture_control().cancel_job(job_id))")
          api = api.replace("            return capture_control().pause()", "            return _normalize_status_payload(capture_control().pause())")
          api = api.replace("            return capture_control().resume()", "            return _normalize_status_payload(capture_control().resume())")
          api_path.write_text(api, encoding="utf-8")

          capture_path = Path("src/control/capture.py")
          capture = capture_path.read_text(encoding="utf-8")
          capture = capture.replace(
              'self._envelope(payload, source_type=str(payload.get("source_type") or "web"), text=text),',
              'self._envelope(payload, source_type=str(payload.get("source_type") or "web"), capture_method="manual_text", text=text),',
          )
          capture = capture.replace(
              'source_type=str(payload.get("source_type") or "web"),\n                url=url,',
              'source_type=str(payload.get("source_type") or "web"),\n                capture_method="manual_web",\n                url=url,',
          )
          capture = capture.replace(
              'return self._submit_path(payload, str(payload.get("source_type") or "web"))',
              'source_type = str(payload.get("source_type") or "web")\n        adapter_name = str(payload.get("adapter_name") or "")\n        capture_method = "manual_chatgpt_export" if source_type == "chatgpt_export" else "manual_codex_report" if source_type == "codex_report" or adapter_name == "codex_work_report" else "manual_file"\n        return self._submit_path(payload, source_type, capture_method=capture_method)',
          )
          capture = capture.replace(
              'payload,\n            "media",\n            options={',
              'payload,\n            "media",\n            capture_method="manual_media",\n            options={',
          )
          capture = capture.replace(
              '"extract_keyframes": bool(payload.get("extract_keyframes", False)),\n            },',
              '"extract_keyframes": bool(payload.get("extract_keyframes", False)),\n                "extract_audio": bool(payload.get("extract_audio", False)),\n            },',
          )
          capture = capture.replace(
              'def _submit_path(self, payload: Mapping[str, Any], source_type: str, *, options: Mapping[str, Any] | None = None) -> dict[str, Any]:',
              'def _submit_path(self, payload: Mapping[str, Any], source_type: str, *, capture_method: str = "manual_file", options: Mapping[str, Any] | None = None) -> dict[str, Any]:',
          )
          capture = capture.replace(
              'self._envelope(payload, source_type=source_type, capture_method="manual_upload", title=',
              'self._envelope(payload, source_type=source_type, capture_method=capture_method, title=',
          )
          capture_path.write_text(capture, encoding="utf-8")

          queue_test = Path("tests/test_extraction_queue.py")
          text = queue_test.read_text(encoding="utf-8")
          old = '''        with sqlite3.connect(self.db_path) as connection:
              plan = connection.execute(
                  "EXPLAIN QUERY PLAN SELECT * FROM extraction_jobs WHERE source_type = ? ORDER BY created_at DESC LIMIT ? OFFSET ?",
                  ("web", 2, 1),
              ).fetchall()
          '''
          new = '''        connection = sqlite3.connect(self.db_path)
              try:
                  plan = connection.execute(
                      "EXPLAIN QUERY PLAN SELECT * FROM extraction_jobs WHERE source_type = ? ORDER BY created_at DESC LIMIT ? OFFSET ?",
                      ("web", 2, 1),
                  ).fetchall()
              finally:
                  connection.close()
          '''
          if old not in text:
              raise SystemExit("SQLite plan test block not found")
          queue_test.write_text(text.replace(old, new), encoding="utf-8")

          api_test = Path("tests/test_capture_api.py")
          tests = api_test.read_text(encoding="utf-8")
          tests = tests.replace('return {"capture_mode": "paused" if self.paused else "low_power", "paused": self.paused}', 'return {"capture_mode": "paused" if self.paused else "low_power", "paused": self.paused, "queue": {"queued": 2, "running": 1, "retrying": 0, "completed": 3, "failed": 0, "cancelled": 1}}')
          tests = tests.replace('return {"inputs": {"text": {"enabled": True}}}', 'return {"capture_mode": "low_power", "inputs": {"text": {"enabled": True}}}')
          tests = tests.replace('return {"job_id": job_id, "status": "queued"}', 'return {"job_id": job_id, "status": "queued", "result_refs": [{"type": "memory", "id": "MEM-1"}], "result_summary": {"memory_count": 1}}')
          additions = '''

          def test_capture_http_contract_is_desktop_safe():
              context, _ = client()
              headers = {"X-LingJi-Token": "secret"}
              with context as api:
                  status = api.get("/api/capture/status", headers=headers).json()
                  capabilities = api.get("/api/capture/capabilities", headers=headers).json()
                  job = api.get("/api/capture/jobs/job-1", headers=headers).json()
              assert status["mode"] == "low_power"
              assert status["mode_label"] == "LOW_POWER"
              assert status["queued"] == 2
              assert status["running"] == 1
              assert status["updated_at"]
              assert capabilities["file_modes"] == ["web_snapshot", "chatgpt_export", "codex_report"]
              assert "media" in capabilities
              assert job["result_refs"] == {"memory_id": "MEM-1"}
              assert isinstance(job["result_summary"], str)
          '''
          additions = "\n".join(line[10:] if line.startswith("          ") else line for line in additions.splitlines())
          if "test_capture_http_contract_is_desktop_safe" not in tests:
              tests += additions
          api_test.write_text(tests, encoding="utf-8")
          '@ | python -

      - name: Compile focused files
        run: python -m compileall -q src/control src/extraction/queue.py tests/test_capture_control.py tests/test_capture_api.py

      - name: Run required five-file gate
        run: |
          python -m pytest `
            tests/test_capture_control.py `
            tests/test_capture_api.py `
            tests/test_control_api.py `
            tests/test_extraction_queue.py `
            tests/test_capture_service.py `
            -v --tb=short

      - name: Run full repository gate
        run: python -m pytest -q --tb=short

      - name: Commit reviewed fixes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/control/api.py src/control/capture.py tests/test_capture_api.py tests/test_extraction_queue.py
          if (git diff --cached --quiet) {
            Write-Host "No coordinated changes to commit"
          } else {
            git commit -m "fix(capture): align control API with manual capture contracts"
            git push origin HEAD:work/p2-05a-capture-control-api
          }
