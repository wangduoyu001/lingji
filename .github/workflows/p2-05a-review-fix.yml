name: P2-05A Coordinated Review Fix

on:
  pull_request:
    branches:
      - feature/second-brain-memory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-05a-coordinated-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-fix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ui.txt
            requirements-test.txt
            requirements-mcp.txt
            constraints/python-3.12-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            -r requirements-ui.txt `
            -r requirements-test.txt `
            -r requirements-mcp.txt `
            -c constraints/python-3.12-windows.txt
          python -m pip check

      - name: Apply coordinated fixes
        run: python scripts/p2_05a_review_fix.py

      - name: Compile focused files
        run: python -m compileall -q src/control src/extraction/queue.py tests/test_capture_control.py tests/test_capture_api.py tests/test_extraction_queue.py

      - name: Run required five-file gate
        run: >-
          python -m pytest
          tests/test_capture_control.py
          tests/test_capture_api.py
          tests/test_control_api.py
          tests/test_extraction_queue.py
          tests/test_capture_service.py
          -v --tb=short

      - name: Run full repository gate
        run: python -m pytest -q --tb=short

      - name: Validate diff
        shell: pwsh
        run: git diff --check

      - name: Upload validated patch
        uses: actions/upload-artifact@v4
        with:
          name: p2-05a-validated-patch
          path: |
            src/control/api.py
            src/control/capture.py
            tests/test_capture_api.py
            tests/test_capture_control.py
            tests/test_extraction_queue.py
          retention-days: 3
