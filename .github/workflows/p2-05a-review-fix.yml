name: P2-05A Coordinated Review Fix

on:
  push:
    branches:
      - work/p2-05a-capture-control-api
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2-05a-coordinated-review
  cancel-in-progress: true

jobs:
  review-fix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/p2-05a-capture-control-api

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ui.txt
            requirements-test.txt
            requirements-mcp.txt
            constraints/python-3.12-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            -r requirements-ui.txt `
            -r requirements-test.txt `
            -r requirements-mcp.txt `
            -c constraints/python-3.12-windows.txt
          python -m pip check

      - name: Apply coordinated fixes
        run: python scripts/p2_05a_review_fix.py

      - name: Compile focused files
        run: python -m compileall -q src/control src/extraction/queue.py tests/test_capture_control.py tests/test_capture_api.py tests/test_extraction_queue.py

      - name: Run required five-file gate
        run: >-
          python -m pytest
          tests/test_capture_control.py
          tests/test_capture_api.py
          tests/test_control_api.py
          tests/test_extraction_queue.py
          tests/test_capture_service.py
          -v --tb=short

      - name: Run full repository gate
        run: python -m pytest -q --tb=short

      - name: Remove temporary review tooling
        shell: pwsh
        run: |
          Remove-Item scripts/p2_05a_review_fix.py -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/p2-05a-patch-diagnostics.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/p2-05a-review-fix.yml -ErrorAction SilentlyContinue

      - name: Validate diff
        shell: pwsh
        run: git diff --check

      - name: Commit reviewed fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(control): align capture API integration contracts"
          git push origin HEAD:work/p2-05a-capture-control-api
