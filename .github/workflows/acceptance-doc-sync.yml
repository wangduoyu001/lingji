name: acceptance-doc-sync

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
      - "work/**"
  pull_request:

permissions:
  contents: read

jobs:
  acceptance-doc-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test acceptance sync checker
        run: python -m pytest -q tests/test_acceptance_sync.py

      - name: Require change-specific acceptance update
        env:
          ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_acceptance_sync.py
