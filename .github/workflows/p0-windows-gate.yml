name: P0 Windows Gate

on:
  workflow_dispatch:
  push:
    branches:
      - work/p0-engineering-hygiene
    paths:
      - "requirements*.txt"
      - "constraints/**"
      - "src/**"
      - "second_brain/**"
      - "tests/**"
      - "scripts/**"
      - "desktop/lingji-control/**"
      - ".github/workflows/p0-windows-gate.yml"
  pull_request:
    branches:
      - feature/second-brain-memory
    paths:
      - "requirements*.txt"
      - "constraints/**"
      - "src/**"
      - "second_brain/**"
      - "tests/**"
      - "scripts/**"
      - "desktop/lingji-control/**"
      - ".github/workflows/p0-windows-gate.yml"

permissions:
  contents: read

concurrency:
  group: p0-windows-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-gate:
    name: Python 3.12 full gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ui.txt
            requirements-test.txt
            requirements-mcp.txt
            constraints/python-3.12-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            -r requirements-ui.txt `
            -r requirements-test.txt `
            -r requirements-mcp.txt `
            -c constraints/python-3.12-windows.txt
          python -m pip check

      - name: Validate clean-install contracts
        shell: pwsh
        run: python scripts/validate_clean_install.py --root . --import-check

      - name: Compile all Python entry points and packages
        shell: pwsh
        run: |
          python -m compileall -q `
            main.py `
            run_service.py `
            run_control_api.py `
            run_mcp_server.py `
            run_extraction_worker.py `
            src `
            second_brain `
            tests `
            scripts

      - name: Run full repository test suite
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q --tb=short

  desktop-gate:
    name: Desktop smoke and build
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: desktop/lingji-control

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/lingji-control/package-lock.json
          package-manager-cache: false

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Run desktop smoke tests
        run: npm run test:smoke

      - name: Build desktop frontend
        run: npm run build
